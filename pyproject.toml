[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "jamgraf"
version = "1.2.0"
description = "A small local wiki for Human/LLM collaboration (SQLite, hybrid RAG, MCP, CRDT co-editing)."
readme = "README.md"
requires-python = ">=3.10"
# Source-available, not open source: use it, copy it, modify it — but do not
# offer it to others as a hosted or managed service. Full text in LICENSE.
license = "Elastic-2.0"
license-files = ["LICENSE"]
authors = [{ name = "VerinFast" }]
keywords = ["wiki", "mcp", "llm", "crdt", "rag", "sqlite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
    "anthropic>=1.0.0",
    "apsw>=3.53.4.0",
    "cryptography>=50.0",
    "fastapi>=0.140.13",
    "fastembed>=0.3",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "linkify-it-py>=2.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "pycrdt-websocket>=0.16.4",
    "pycrdt>=0.14.4,<0.15",
    "pydantic>=2.7",
    "pygments>=2.21",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.32",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.52.4",
    "xhtml2pdf>=0.2.17",
]

[project.urls]
Homepage = "https://github.com/VerinFast/jamgraf"
Source = "https://github.com/VerinFast/jamgraf"
Issues = "https://github.com/VerinFast/jamgraf/issues"

# The Mac .app is not what pip ships. `jamgraf` is the server and `jamgraf-mcp`
# the MCP stdio endpoint — the half that runs anywhere, with no window and no
# GUI dependency. `jamgraf-app` is the window, and needs the `desktop` extra;
# it is how Windows gets one, and it is a no-op install on a Mac that already
# has the cask.
[project.scripts]
jamgraf = "jamgraf.__main__:serve"
jamgraf-mcp = "jamgraf.__main__:mcp"
jamgraf-app = "jamgraf.desktop:main"

# pywebview is not a hard dependency: `pip install jamgraf` must stay installable
# on a headless box, and the Mac app brings its own. On Windows pywebview pulls
# pythonnet itself and drives Microsoft's WebView2 runtime; a machine without
# that runtime is told so and gets the browser (jamgraf/desktop/windows.py).
[project.optional-dependencies]
desktop = ["pywebview>=6.2"]

# Templates, static assets and the vendored interchange library are runtime
# data, not incidental files — the server 500s without the first two, and the
# Kahala round-trip needs the third. Hatchling ships only .py by default.
[tool.hatch.build.targets.wheel]
packages = ["jamgraf"]

[tool.hatch.build.targets.sdist]
include = ["jamgraf", "README.md", "LICENSE", "docs", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
